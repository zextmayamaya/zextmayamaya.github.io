name: everyday-recite

on:
  workflow_dispatch:
  schedule:
    - cron: '50 15 * * *'

#env:
#  ACTIONS_STEP_DEBUG: true

jobs:
  create_html:
    runs-on: ubuntu-22.04
#    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: shell create file
        run: |
          git pull
          day=$(date --date="1day" +%F)
          content=$(cat everydayRecite.csv | grep ${day} | cut -d ',' -f 3)
          echo "${day} ${content} recite done" > checkError
          dayNoSort=$(date +%-m月%-d日 -d "1day")
          contentNoSort=$(cat readNotSort | grep ${dayNoSort} | awk -F, '$2!="任务完成" {print $2" "$3"章 "$4} $2=="任务完成" {print $2$3}')
          echo "${dayNoSort} ${contentNoSort} nosort done" >> checkError
          cat template.html | sed -e "13c ${day}" | sed -e "16c ${content}" | sed -e "26c ${dayNoSort}" | sed -e "29c ${contentNoSort}" > index.html
          echo "任务一完成" >> checkError
        continue-on-error: true
      - name: add schedule B
        run: |
          daySort=$(date -d "1day" +%Y/%-m/%-d)
          contentSort=$(cat readSort | grep "${daySort}," | cut -d ',' -f 2)
          echo "${daySort} ${contentSort} sort done" >> checkError
          cat index.html | sed -e "38c ${daySort}" | sed -e "41c ${contentSort}" > index1.html
          rm index.html
          mv index1.html index.html
          echo -e "任务二完成\n" >> checkError
          rm -f checkError
      - name: pull files
        run: |
          git config --global user.email "mayamaya@live.cn"
          git config --global user.name "zextmayamaya"
          git add .
          git commit -m "update index.html"
          git status
          git push origin develop 
