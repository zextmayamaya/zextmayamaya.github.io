<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>全年背/读计划</title>
</head>
<body>
	<div class="container">
		<h2 class="header">背诵计划</h2>
		<div class="content">
			<p>
2024-12-08
			</p>
			<p>背诵：
"歌罗西书 3章18-19节"
			</p>
				
		</div>
	</div>

	<div class="container">
		<h2 class="header">新旧约对应阅读计划</h2>
		<div class="content">
			<p>
12月8日
			</p>
			<p>阅读：
摩 7-9章 
			</p>
		</div>
	</div>
				
	<div class="container">
		<h2 class="header">按圣经目录顺序阅读</h2>
		<div class="content">
			<p>
2024/12/8
			</p>
			<p>阅读：
提后1-4章
			</p>
		</div>
	</div>

	<button class="button" onclick="showContent()">缩写对照表</button>
	<div class="pic"><img src="image/shortName.jpg" alt="缩写对照表"></div>

	<style>
		*, html, body{
			margin: 0;
			padding: 0;
		}
		body{
			width: 100vw;
			height: 100vh;
			background-color: #000;
		}
		.container{
			display: block;
			width: 400px;
			margin: 10px auto;
			font-size: 18px;
		}
		.header, .content{
			text-align: center;
			background-color: #59afa6;
			font-family: "微软雅黑";
			font-weight: bold;
			padding-top: 20px;
		}
		.header{
			color: #fff;
			display: block;
			border-bottom: 1px dashed lightgrey;
			min-height: 50px;
			border-radius: 10px;
		}
		.content{
			display: none;
			min-height: 100px;
			color: #fffa80;
			font-size: 22px;
		}
		.button{
			border: none;
			width: 80px;
			height: 40px;
			background-color: yellow;
			position: absolute;
			left: 0;
			top: 50%;
			z-index: 10;
		}
		.pic{
			position: absolute;
			z-index: 5;
			top: 0;
			left: 0;
			display: none;
			width: 100vw;
			height: 100vh;
			background-color: rgba(0, 0, 0, 0.5);
			text-align: center;
			overflow-y: scroll;
		}
		.pic img{
			max-width: 388px;
		}
	</style>
	<script>
		window.addEventListener('load', function () {
			// 加载页面后运行
			const boxes = document.querySelectorAll('.container');

			boxes.forEach(box => {
				const h = box.querySelector('.header');
				const div = box.querySelector('.content');

				h.addEventListener('click', () => {
					const hided = div.style.display === 'none';
					div.style.display = hided ? 'block' : 'none';

					if ( !hided ) {
						h.style.borderRadius = '10px';
					} else {
						h.style.borderRadius = '10px 10px 0 0';
						div.style.borderRadius = '0 0 10px 10px';
					}
				})
			})

		})
		function showContent(){
			const pic = document.querySelector('.pic')
			if(pic.style.display === 'block'){
				pic.style.display = 'none';
			} else {
				pic.style.display = 'block';
			}
		}


	</script>
</body>
</html>
